<svg xmlns="http://www.w3.org/2000/svg" width="820" height="14" viewBox="0 0 820 14">
  <defs>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0"   stop-color="#00ff9f" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff9f" stop-opacity="1"/>
      <stop offset="1"   stop-color="#00b8ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .scan { animation: sweep 3s linear infinite; filter: drop-shadow(0 0 5px #00ff9f); }
    @keyframes sweep { from { transform: translateX(-220px); } to { transform: translateX(820px); } }
  </style>
  <rect x="0" y="6" width="820" height="2" fill="#00ff9f22"/>
  <rect class="scan" x="0" y="5" width="220" height="4" rx="2" fill="url(#beam)"/>
</svg>
