<svg xmlns="http://www.w3.org/2000/svg" width="820" height="260" viewBox="0 0 820 260">
  <style>
    .edge  { stroke: #ff2a6d22; stroke-width: 1.2; }
    .node  { fill: #0d0221; stroke: #ff2a6d; stroke-width: 2; animation: pulse 2.4s ease-in-out infinite; }
    .node.out { stroke: #05d9e8; }
    @keyframes pulse {
      0%, 100% { filter: drop-shadow(0 0 2px #ff2a6d); }
      50%      { filter: drop-shadow(0 0 10px #ff2a6d); }
    }
    .lbl { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; fill: #7a6b9a; }
    .lbl.hi { fill: #ff2a6d; }
    .sig { fill: #ff2a6d; filter: drop-shadow(0 0 4px #ff2a6d); }
    .sig2 { fill: #05d9e8; filter: drop-shadow(0 0 4px #05d9e8); }
  </style>

  <rect width="820" height="260" fill="#0d0221" rx="12"/>

  <!-- edges: input(3) -> hidden1(4) -> hidden2(4) -> output(2) -->
  <g class="edge">
    <!-- in -> h1 -->
    <line x1="130" y1="70"  x2="320" y2="50"/><line x1="130" y1="70"  x2="320" y2="105"/><line x1="130" y1="70"  x2="320" y2="160"/><line x1="130" y1="70"  x2="320" y2="215"/>
    <line x1="130" y1="130" x2="320" y2="50"/><line x1="130" y1="130" x2="320" y2="105"/><line x1="130" y1="130" x2="320" y2="160"/><line x1="130" y1="130" x2="320" y2="215"/>
    <line x1="130" y1="190" x2="320" y2="50"/><line x1="130" y1="190" x2="320" y2="105"/><line x1="130" y1="190" x2="320" y2="160"/><line x1="130" y1="190" x2="320" y2="215"/>
    <!-- h1 -> h2 -->
    <line x1="320" y1="50"  x2="510" y2="50"/><line x1="320" y1="50"  x2="510" y2="105"/><line x1="320" y1="50"  x2="510" y2="160"/><line x1="320" y1="50"  x2="510" y2="215"/>
    <line x1="320" y1="105" x2="510" y2="50"/><line x1="320" y1="105" x2="510" y2="105"/><line x1="320" y1="105" x2="510" y2="160"/><line x1="320" y1="105" x2="510" y2="215"/>
    <line x1="320" y1="160" x2="510" y2="50"/><line x1="320" y1="160" x2="510" y2="105"/><line x1="320" y1="160" x2="510" y2="160"/><line x1="320" y1="160" x2="510" y2="215"/>
    <line x1="320" y1="215" x2="510" y2="50"/><line x1="320" y1="215" x2="510" y2="105"/><line x1="320" y1="215" x2="510" y2="160"/><line x1="320" y1="215" x2="510" y2="215"/>
    <!-- h2 -> out -->
    <line x1="510" y1="50"  x2="700" y2="95"/><line x1="510" y1="50"  x2="700" y2="165"/>
    <line x1="510" y1="105" x2="700" y2="95"/><line x1="510" y1="105" x2="700" y2="165"/>
    <line x1="510" y1="160" x2="700" y2="95"/><line x1="510" y1="160" x2="700" y2="165"/>
    <line x1="510" y1="215" x2="700" y2="95"/><line x1="510" y1="215" x2="700" y2="165"/>
  </g>

  <!-- travelling signals (SMIL) -->
  <circle class="sig" r="4"><animateMotion dur="2.4s" repeatCount="indefinite" path="M130,70 L320,105 L510,50 L700,95"/></circle>
  <circle class="sig" r="4"><animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite" path="M130,130 L320,160 L510,105 L700,165"/></circle>
  <circle class="sig2" r="4"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M130,190 L320,215 L510,160 L700,95"/></circle>
  <circle class="sig" r="4"><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite" path="M130,70 L320,50 L510,215 L700,165"/></circle>
  <circle class="sig2" r="4"><animateMotion dur="2.4s" begin="0.9s" repeatCount="indefinite" path="M130,190 L320,105 L510,105 L700,95"/></circle>

  <!-- nodes -->
  <circle class="node" cx="130" cy="70"  r="13"/>
  <circle class="node" cx="130" cy="130" r="13" style="animation-delay:.3s"/>
  <circle class="node" cx="130" cy="190" r="13" style="animation-delay:.6s"/>
  <circle class="node" cx="320" cy="50"  r="13" style="animation-delay:.2s"/>
  <circle class="node" cx="320" cy="105" r="13" style="animation-delay:.5s"/>
  <circle class="node" cx="320" cy="160" r="13" style="animation-delay:.8s"/>
  <circle class="node" cx="320" cy="215" r="13" style="animation-delay:1.1s"/>
  <circle class="node" cx="510" cy="50"  r="13" style="animation-delay:.4s"/>
  <circle class="node" cx="510" cy="105" r="13" style="animation-delay:.7s"/>
  <circle class="node" cx="510" cy="160" r="13" style="animation-delay:1s"/>
  <circle class="node" cx="510" cy="215" r="13" style="animation-delay:1.3s"/>
  <circle class="node out" cx="700" cy="95"  r="15" style="animation-delay:.9s"/>
  <circle class="node out" cx="700" cy="165" r="15" style="animation-delay:1.2s"/>

  <!-- labels -->
  <text class="lbl" x="40" y="74">data</text>
  <text class="lbl" x="40" y="134">code</text>
  <text class="lbl" x="40" y="194">coffee</text>
  <text class="lbl hi" x="728" y="99">insights</text>
  <text class="lbl hi" x="728" y="169">products</text>
  <text class="lbl" x="320" y="250" text-anchor="middle">hidden_layer_1</text>
  <text class="lbl" x="510" y="250" text-anchor="middle">hidden_layer_2</text>
</svg>
