<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340">
  <style>
    .bg   { fill: #0d1117; }
    .bar  { fill: #161b22; }
    .t    { font-family: 'Fira Code', 'Courier New', monospace; font-size: 15px; fill: #c9d1d9; }
    .g    { fill: #00ff9f; }
    .c    { fill: #00b8ff; }
    .y    { fill: #ffd866; }
    .dim  { fill: #6e7681; }
    .line { opacity: 0; animation: show 14s infinite; }
    .l1 { animation-delay: 0.3s; }
    .l2 { animation-delay: 1.1s; }
    .l3 { animation-delay: 1.9s; }
    .l4 { animation-delay: 2.7s; }
    .l5 { animation-delay: 3.5s; }
    .l6 { animation-delay: 4.3s; }
    .l7 { animation-delay: 5.1s; }
    .l8 { animation-delay: 5.9s; }
    .l9 { animation-delay: 6.7s; }
    @keyframes show {
      0%   { opacity: 0; }
      2%   { opacity: 1; }
      85%  { opacity: 1; }
      90%  { opacity: 0; }
      100% { opacity: 0; }
    }
    .bar-fill { animation: load 14s infinite; animation-delay: 2.7s; transform-box: fill-box; transform-origin: left; transform: scaleX(0); }
    @keyframes load {
      0%   { transform: scaleX(0); }
      6%   { transform: scaleX(1); }
      85%  { transform: scaleX(1); }
      90%  { transform: scaleX(0); }
      100% { transform: scaleX(0); }
    }
    .cursor { animation: blink 1s steps(1) infinite; fill: #00ff9f; }
    @keyframes blink { 50% { opacity: 0; } }
    .glow { filter: drop-shadow(0 0 6px #00ff9f66); }
  </style>

  <rect class="bg" x="1" y="1" width="818" height="338" rx="12" stroke="#00ff9f55" stroke-width="2"/>
  <rect class="bar" x="2" y="2" width="816" height="34" rx="11"/>
  <rect class="bar" x="2" y="22" width="816" height="14"/>
  <circle cx="24" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="19" r="6" fill="#27c93f"/>
  <text class="t dim" x="410" y="24" text-anchor="middle" font-size="13">som@github: ~/profile — zsh</text>

  <g class="glow">
    <text class="t line l1" x="24" y="70"><tspan class="g">som@github</tspan><tspan class="dim">:</tspan><tspan class="c">~</tspan><tspan class="dim">$</tspan> ./boot_profile.sh</text>
    <text class="t line l2" x="24" y="100"><tspan class="dim">[</tspan><tspan class="g"> OK </tspan><tspan class="dim">]</tspan> Loading modules: python · sql · react · gcp</text>
    <text class="t line l3" x="24" y="130"><tspan class="dim">[</tspan><tspan class="g"> OK </tspan><tspan class="dim">]</tspan> Mounting ML models: xgboost · k-means · tf-idf · llama3</text>
    <g class="line l4">
      <text class="t" x="24" y="160"><tspan class="y">[ .. ]</tspan> Training neural net</text>
      <rect x="320" y="148" width="300" height="14" rx="3" fill="#161b22" stroke="#00ff9f55"/>
      <rect class="bar-fill" x="320" y="148" width="300" height="14" rx="3" fill="#00ff9f"/>
      <text class="t g" x="635" y="160">100%</text>
    </g>
    <text class="t line l5" x="24" y="190"><tspan class="dim">[</tspan><tspan class="g"> OK </tspan><tspan class="dim">]</tspan> Connecting PostgreSQL → seat_booking_db</text>
    <text class="t line l6" x="24" y="220"><tspan class="dim">[</tspan><tspan class="g"> OK </tspan><tspan class="dim">]</tspan> Deploying dashboards: BunkerSmart · CareerLens AI</text>
    <text class="t line l7" x="24" y="250"><tspan class="dim">[</tspan><tspan class="c">INFO</tspan><tspan class="dim">]</tspan> Status: <tspan class="g">open to work</tspan> → DS · SDE · DevOps</text>
    <text class="t line l8" x="24" y="280"><tspan class="dim">[</tspan><tspan class="g"> OK </tspan><tspan class="dim">]</tspan> System ready. Welcome to Som's profile ⚡</text>
    <g class="line l9">
      <text class="t" x="24" y="312"><tspan class="g">som@github</tspan><tspan class="dim">:</tspan><tspan class="c">~</tspan><tspan class="dim">$</tspan></text>
      <rect class="cursor" x="176" y="299" width="9" height="17"/>
    </g>
  </g>
</svg>
